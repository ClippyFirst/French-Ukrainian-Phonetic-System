name: Build and deploy static site
on:
  push:
    branches: [main, feat/french-ipa-ufpn-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Charis 7 UFPN glyphs and OpenType anchors
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli uharfbuzz
          python scripts/audit-charis-font.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render UFPN combining marks in Chromium
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/charis-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/charis-browser-render.mjs
      - name: Upload Charis 7 browser specimen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charis-7-ufpn-browser-specimen
          path: artifacts/charis-7.000-ufpn.png
          if-no-files-found: warn
          retention-days: 7
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
