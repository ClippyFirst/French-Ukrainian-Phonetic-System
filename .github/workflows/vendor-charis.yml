name: Vendor official Charis 7 webfonts
on:
  push:
    branches: [fix/vendor-charis-7-diacritics]
    paths:
      - .github/workflows/vendor-charis.yml
permissions:
  contents: write
jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Download and verify official SIL release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Charis-7.000.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/silnrsi/font-charis/releases/download/v7.000/Charis-7.000.zip \
            --output "$archive"
          echo "e3237b1303c5d31af8f59b1d1914886c5e873b77c71390e4742fb3bc1c187666  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/charis"
          unzip -q "$archive" -d "$RUNNER_TEMP/charis"
          regular="$(find "$RUNNER_TEMP/charis" -type f -name Charis-Regular.woff2 -print -quit)"
          bold="$(find "$RUNNER_TEMP/charis" -type f -name Charis-Bold.woff2 -print -quit)"
          license="$(find "$RUNNER_TEMP/charis" -type f -iname OFL.txt -print -quit)"
          test -n "$regular" && test -n "$bold" && test -n "$license"
          mkdir -p assets/fonts licenses
          cp "$regular" assets/fonts/Charis-Regular.woff2
          cp "$bold" assets/fonts/Charis-Bold.woff2
          cp "$license" licenses/Charis-OFL.txt
      - name: Commit verified webfonts to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/Charis-Regular.woff2 assets/fonts/Charis-Bold.woff2 licenses/Charis-OFL.txt
          git commit -m "chore: vendor verified SIL Charis 7 webfonts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
